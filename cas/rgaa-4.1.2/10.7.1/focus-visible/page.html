<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Prise de focus</title>
<style>
body { margin: 2rem; background: #fff; color: #1b1b1b; font-size: 16px; }
a:focus, a:focus-visible { outline: 3px solid #000; outline-offset: 2px; }
</style>
</head>
<body>
<p><a href="/horaires" autofocus>Horaires d'ouverture</a></p>

</body>
</html>
